# Demo credentials. **Replace before any production-ish use.** The
# operator should manage this Secret out-of-band (sealed-secrets,
# external-secrets, kubectl create secret ...) and remove this file
# from the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: shim-credentials
type: Opaque
stringData:
  access-key: "shim-admin-replace-me"
  secret-key: "shim-secret-replace-me"
